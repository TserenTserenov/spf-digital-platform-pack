    reason: "Буквальная локализация 'gate' как 'шлюз' — меняет сложившийся термин и его узнаваемость, никогда не встречается в текстах платформы"
selection_rationale: >
  АрхГейт/ArchGate — первый кандидат на живую карточку NameCard (WP-474 Ф12):
  устоявшийся публичный термин, используемый как самостоятельная блокирующая
  процедура на уровне платформенного CLAUDE.md (§5 «АрхГейт — ОБЯЗАТЕЛЬНАЯ
  оценка»), за пределами своего Pack'а и вне зависимости от того, кто читает
  DP.M.005 напрямую. Plain/tech пара не изобретена — извлечена из уже
  действующего frontmatter (name: АрхГейт (ArchGate)) и синонимов в теле
  метода; карточка документирует уже сложившееся решение об имени, а не
  разрешает конкурирующий спор между вариантами.
